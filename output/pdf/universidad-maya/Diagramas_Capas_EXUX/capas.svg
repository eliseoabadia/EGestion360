<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1380 690" role="img" aria-label="La solución organizada por capas"><title>La solución organizada por capas</title><defs><marker id="arrow-capas" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#658A9F"/></marker></defs><path d="M 670.0,114 L 670.0,150" fill="none" stroke="#658A9F" stroke-width="1.6" marker-end="url(#arrow-capas)"/><path d="M 670.0,244 L 670.0,280" fill="none" stroke="#658A9F" stroke-width="1.6" marker-end="url(#arrow-capas)"/><path d="M 670.0,374 L 670.0,410" fill="none" stroke="#658A9F" stroke-width="1.6" marker-end="url(#arrow-capas)"/><path d="M 80,327.0 L 15,327.0 L 15,587.0 L 80,587.0" fill="none" stroke="#658A9F" stroke-width="1.6" stroke-dasharray="7 5" marker-end="url(#arrow-capas)"/><g><rect x="80" y="20" width="1180" height="94" rx="12" fill="#F0F4F8" stroke="#ABBDC9" stroke-width="1.2"/><text x="98" y="43" font-family="Arial" font-size="19" font-weight="700" fill="#143044">1 · Personas y acceso</text><text x="98" y="73" font-family="Arial" font-size="14" font-weight="400" fill="#4B6577">Áreas, responsables y auditores · Empresa, sucursal y permisos</text></g><g><rect x="80" y="150" width="1180" height="94" rx="12" fill="#FFFFFF" stroke="#A8BCCC" stroke-width="1.2"/><text x="98" y="173" font-family="Arial" font-size="19" font-weight="700" fill="#143044">2 · Experiencia de usuario</text><text x="98" y="203" font-family="Arial" font-size="14" font-weight="400" fill="#4B6577">Portales y pantallas para solicitar, operar, autorizar y consultar</text></g><g><rect x="80" y="280" width="1180" height="94" rx="12" fill="#096D9B" stroke="#096D9B" stroke-width="1.2"/><text x="98" y="303" font-family="Arial" font-size="19" font-weight="700" fill="#FFFFFF">3 · Procesos y servicios de negocio</text><text x="98" y="333" font-family="Arial" font-size="14" font-weight="400" fill="#FFFFFF">15 módulos · Reglas, validaciones y transacciones coordinadas</text></g><g><rect x="80" y="410" width="1180" height="94" rx="12" fill="#FCF5E8" stroke="#D0AC69" stroke-width="1.2"/><text x="98" y="433" font-family="Arial" font-size="19" font-weight="700" fill="#143044">4 · Persistencia y evidencia</text><text x="98" y="463" font-family="Arial" font-size="14" font-weight="400" fill="#4B6577">SQL Server · EmptyProjects + complemento de GestionEmpresarial + ERD EXUX</text></g><g><rect x="80" y="540" width="1180" height="94" rx="12" fill="#F5F1FA" stroke="#AA95C4" stroke-width="1.2"/><text x="98" y="563" font-family="Arial" font-size="19" font-weight="700" fill="#143044">5 · Intercambio con otros sistemas</text><text x="98" y="593" font-family="Arial" font-size="14" font-weight="400" fill="#4B6577">Contratos de banco, SAT/PAC y OCR por definir · No se implementaron conectores</text></g></svg>