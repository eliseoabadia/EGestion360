<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EG.Web</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="EG.Web.styles.css" rel="stylesheet" />
    <script type="importmap"></script>
    <!-- CSS de la app -->
    <link href="css/app.css" rel="stylesheet" />

    <!-- CSS de MudBlazor -->
    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />

</head>
<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <!-- Cargar MudBlazor JS ANTES de blazor.webassembly.js si Blazor llama a funciones al iniciar.
     Si persiste el problema, prueba a mover este <script> después de blazor.webassembly.js. -->
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    <script src="js/egestion-combo-scroll.js"></script>
    <script src="js/download.js"></script>
    <script src="js/mudBlazorTheme.js"></script>
    <script src="js/dialogDrag.js"></script>

    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>

</html>
