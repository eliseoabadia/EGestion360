<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EG.Web</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="EG.Web.styles.css" rel="stylesheet" />
    <script type="importmap"></script>
    <!-- CSS de MudBlazor -->
    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />

        <div class="app-boot-shell">
            <section class="app-boot-card" role="status" aria-live="polite">

        <span class="dismiss">🗙</span>

     Si persiste el problema, prueba a mover este <script> después de blazor.webassembly.js. -->

    <script src="js/egestion-combo-scroll.js"></script>
    <script src="js/download.js"></script>
    <script src="js/documentSupport.js"></script>
    <script src="js/mudBlazorTheme.js"></script>
    <script src="js/sidebarResize.js"></script>

    <script src="_content/DevExpress.Blazor.Reporting.JSBasedControls.Common/dx-blazor-webdocumentviewer-4e5fc384fecb4d5b3791.js"></script>
