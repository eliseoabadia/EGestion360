<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
        (() => {
            const nortonSafeLocalUrl = window.location.hostname === "localhost"
                && window.location.protocol === "https:"
                && window.location.port === "7279";

            if (nortonSafeLocalUrl) {
                window.location.replace(`http://localhost:5242${window.location.pathname}${window.location.search}${window.location.hash}`);
            }
        })();
    </script>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>EG.Web</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css?v=20260704-session-cache" />
    <link rel="stylesheet" href="css/app.css?v=20260723-progressive-actions" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="EG.Web.styles.css?v=20260723-progressive-actions" rel="stylesheet" />
    <script type="importmap"></script>
    <!-- CSS de MudBlazor -->
    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/entry-screens.css?v=20260719-entry-refresh" />

</head>
<body>
    <div id="app">
        <div class="app-boot-shell">
            <section class="app-boot-card" role="status" aria-live="polite">
                <div class="app-boot-brand">EGestion<span>360</span></div>
                <div class="app-boot-loader" aria-hidden="true"></div>
                <h1>Preparando tu espacio de trabajo</h1>
                <p>Estamos cargando la plataforma y validando los recursos necesarios en segundo plano.</p>
            </section>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <!-- Cargar MudBlazor JS ANTES de blazor.webassembly.js si Blazor llama a funciones al iniciar.
     Si persiste el problema, prueba a mover este <script> después de blazor.webassembly.js. -->
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    <script src="js/egestion-combo-scroll.js?v=20260704-session-cache"></script>
    <script src="js/download.js?v=20260704-session-cache"></script>
    <script src="js/documentSupport.js?v=20260704-session-cache"></script>
    <script src="js/genericTableColumns.js?v=20260704-session-cache"></script>
    <script src="js/reportingPdf.js?v=20260704-session-cache"></script>
    <script src="js/mudBlazorTheme.js?v=20260704-session-cache"></script>
    <script src="js/sidebarResize.js?v=20260704-session-cache"></script>
    <script src="js/dialogDrag.js?v=20260708-dialog-layout"></script>
    <script src="js/loginAutofill.js?v=20260704-session-cache"></script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js" autostart="false"></script>
    <script>
        (() => {
            const isLocalHost = ["localhost", "127.0.0.1", "::1"].includes(window.location.hostname);
            const apiBaseUrl = isLocalHost
                ? "http://localhost:5198/"
                : `${window.location.protocol}//${window.location.hostname}:8440/`;
            const runtimeConfiguration = JSON.stringify({
                ApiSetting: { baseUrl: apiBaseUrl }
            });

            Blazor.start({
                loadBootResource: (type) => {
                    if (type !== "configuration") {
                        return null;
                    }

                    return Promise.resolve(new Response(runtimeConfiguration, {
                        status: 200,
                        headers: { "Content-Type": "application/json" }
                    }));
                }
            }).catch(error => console.error("No fue posible iniciar EGestion360.", error));
        })();
    </script>
</body>

</html>
